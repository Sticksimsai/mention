# Render Blueprint — deploys the full memes stack in one go.
# Render → New → Blueprint → pick this repo. You'll be prompted for the
# Privy keys (sync: false vars); everything else wires itself.
#
# Domains: getmentions.xyz (web) + api.getmentions.xyz (api) — set as custom
# domains on the two services; DNS: A @ -> 216.24.57.1, CNAME api -> memes-api.onrender.com

services:
  # ───────────── API ─────────────
  - type: web
    name: memes-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: pnpm --filter @mention/db migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: memes-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: memes-redis, property: connectionString }
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_ORIGIN
        value: https://memes-web-9rwt.onrender.com
      - key: API_PUBLIC_URL
        value: https://memes-api-9rwt.onrender.com
      - key: X_REDIRECT_URI
        value: https://memes-api-9rwt.onrender.com/v1/x/callback
      # Token images and metadata are served from the API; this must be its public URL.
      - key: PUBLIC_ASSET_ORIGIN
        value: https://memes-api-9rwt.onrender.com
      # Launches are funded and signed by the launcher's own wallet.
      - key: LAUNCH_ENABLED
        value: "true"
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      # SOLANA_RPC_URL is deliberately not managed here: set a private RPC (for example
      # Helius) in the dashboard. Without it the API uses the rate-limited public endpoint.
      - key: PLATFORM_FEE_WALLET
        sync: false
      - key: PLATFORM_TRADE_FEE_BPS
        value: "100"
      - key: PLATFORM_CREATOR_FEE_SHARE_BPS
        value: "5000"
      - key: PLATFORM_WALLET_SECRET
        sync: false

  # ───────────── Worker ─────────────
  - type: worker
    name: memes-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: memes-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: memes-redis, property: connectionString }
      - key: SOCIALDATA_API_KEY
        sync: false
      - key: SOCIALDATA_DAILY_CAP
        value: "50000"
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        fromService: { type: web, name: memes-api, envVarKey: TOKEN_ENCRYPTION_KEY }

  # ───────────── Web ─────────────
  - type: web
    name: memes-web
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://memes-api-9rwt.onrender.com
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false

  # ───────────── Redis (Key Value) ─────────────
  - type: keyvalue
    name: memes-redis
    plan: starter
    ipAllowList: []   # internal connections only

databases:
  - name: memes-db
    plan: basic-256mb
    postgresMajorVersion: "16"
