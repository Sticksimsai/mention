# Local development infrastructure. In production, Railway provides
# managed Postgres + Redis plugins — see README.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tribes
      POSTGRES_PASSWORD: tribes
      POSTGRES_DB: tribes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  pgdata:
